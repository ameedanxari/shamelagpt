name: iOS TestFlight

# Manual only. Shipping a build to testers is not something a push should do by
# accident, and the build number has to be decided deliberately.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CURRENT_PROJECT_VERSION for this upload. Must be higher than the last build uploaded for marketing version 1.1."
        required: true
        type: string

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shamelagpt-ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      # A CI runner has no unlocked login keychain, so the distribution certificate
      # cannot simply "be there" the way it is on a developer's Mac. It is imported
      # into a throwaway keychain that exists only for this job.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm $RUNNER_TEMP/certificate.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Automatic signing needs to talk to App Store Connect to resolve profiles,
      # which it does with the same API key used for the upload.
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Set build number
        run: |
          set -euo pipefail
          # Applied to every target so the app and both extensions stay in lockstep;
          # App Store Connect rejects a build whose extensions disagree with the host.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};/g" \
            ShamelaGPT.xcodeproj/project.pbxproj
          grep -c "CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};" ShamelaGPT.xcodeproj/project.pbxproj

      # Uploading a build that fails its own tests wastes a TestFlight slot and a
      # reviewer's time, so this gates the archive.
      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme ShamelaGPT \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -testPlan ShamelaGPT \
            -only-testing:ShamelaGPTTests \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -scheme ShamelaGPT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/ShamelaGPT.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID \
            -authenticationKeyIssuerID $ASC_ISSUER_ID \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ShamelaGPT.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID \
            -authenticationKeyIssuerID $ASC_ISSUER_ID

      # Validate before upload: it catches missing icons, entitlement mismatches and
      # bad Info.plist keys in seconds, rather than as an email an hour later.
      - name: Validate
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --validate-app \
            -f $RUNNER_TEMP/export/ShamelaGPT.ipa \
            -t ios \
            --apiKey $ASC_KEY_ID \
            --apiIssuer $ASC_ISSUER_ID

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/ShamelaGPT.ipa \
            -t ios \
            --apiKey $ASC_KEY_ID \
            --apiIssuer $ASC_ISSUER_ID

      # dSYMs are needed to symbolicate crash reports and are not recoverable later.
      - name: Keep the dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-build-${{ inputs.build_number }}
          path: ${{ runner.temp }}/ShamelaGPT.xcarchive/dSYMs
          if-no-files-found: warn

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
